
name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  order-service-tests:
    name: Order Service Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: commerce_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: Aminadia@123
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d commerce_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    defaults:
      run:
        working-directory: services/order-service

    env:
      DATABASE_URL: postgresql+psycopg://postgres:Aminadia%40123@localhost:5432/commerce_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: pytest -v
